<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Waitlist · Slotwise</title>
  <meta name="robots" content="noindex">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/calm.css">
</head>
<body>
  <div class="owner-layout" id="owner-layout" hidden>
    <aside class="sidebar" id="sidebar"></aside>
    <main class="owner-main">
      <div class="page-head"><h1>Waitlist</h1></div>
      <div class="toolbar">
        <label class="check" for="wl-date">Day</label>
        <input type="date" id="wl-date" aria-label="Day">
        <button class="btn btn-ghost btn-small" type="button" id="wl-all">All upcoming</button>
      </div>
      <div id="waitlist" aria-live="polite"><p class="notice is-loading">Loading…</p></div>
    </main>
  </div>
  <script type="module" src="/js/owner-waitlist.js"></script>
</body>
</html>
