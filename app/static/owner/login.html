<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio login · Slotwise</title>
  <meta name="robots" content="noindex">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/calm.css">
</head>
<body>
  <main class="center-page">
    <form class="card" id="login-form" novalidate>
      <a class="logo" href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#33C375" d="M20 3C10 3 4 8.5 4 15.5c0 1.6.4 3 1 4.2C6.8 13 11 9.6 16 8c-4.3 2.6-7.4 6.6-8.6 12 1.2.6 2.6 1 4.1 1C18.6 21 21 14 20 3z"/></svg> Slotwise</a>
      <h1>Studio login</h1>
      <p class="muted">Sign in to manage bookings, the menu and your team.</p>
      <div class="alert" id="login-error" role="alert" hidden></div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-block" type="submit">Log in</button>
      <p class="card-footer"><a href="/">Back to studio page</a></p>
    </form>
  </main>
  <script type="module" src="/js/owner-login.js"></script>
</body>
</html>
