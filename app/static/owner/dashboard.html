<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · Slotwise</title>
  <meta name="robots" content="noindex">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/calm.css">
</head>
<body>
  <div class="owner-layout" id="owner-layout" hidden>
    <aside class="sidebar" id="sidebar"></aside>
    <main class="owner-main">
      <div class="page-head">
        <div>
          <h1 id="welcome">Dashboard</h1>
          <p class="muted" id="today"></p>
        </div>
        <div class="row">
          <label class="check" for="dash-date">Day</label>
          <input type="date" id="dash-date" aria-label="Dashboard day">
        </div>
      </div>
      <div id="dashboard" aria-live="polite"><p class="notice">Loading…</p></div>
    </main>
  </div>
  <script type="module" src="/js/owner-dashboard.js"></script>
</body>
</html>
