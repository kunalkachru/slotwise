<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · Slotwise</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="owner-layout" id="owner-layout" hidden>
    <aside class="sidebar">
      <a class="logo" href="/owner/dashboard.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#33C375" d="M20 3C10 3 4 8.5 4 15.5c0 1.6.4 3 1 4.2C6.8 13 11 9.6 16 8c-4.3 2.6-7.4 6.6-8.6 12 1.2.6 2.6 1 4.1 1C18.6 21 21 14 20 3z"/></svg> Slotwise</a>
      <nav aria-label="Owner menu">
        <a href="/owner/dashboard.html" aria-current="page">Dashboard</a>
        <a class="soon" aria-disabled="true">Bookings <span class="badge">soon</span></a>
        <a class="soon" aria-disabled="true">Services &amp; add-ons <span class="badge">soon</span></a>
        <a class="soon" aria-disabled="true">Therapists &amp; hours <span class="badge">soon</span></a>
        <a class="soon" aria-disabled="true">Waitlist <span class="badge">soon</span></a>
        <button type="button" id="logout">Log out</button>
      </nav>
    </aside>
    <main class="owner-main">
      <header>
        <h1 id="welcome">Dashboard</h1>
        <p class="muted" id="today"></p>
      </header>
      <section class="tiles" aria-label="Key numbers">
        <div class="tile"><div class="tile-label">Today's bookings</div><div class="tile-value">–</div></div>
        <div class="tile"><div class="tile-label">Expected revenue today</div><div class="tile-value">–</div></div>
        <div class="tile"><div class="tile-label">No-show rate (30 days)</div><div class="tile-value">–</div></div>
        <div class="tile"><div class="tile-label">Refilled from waitlist (30 days)</div><div class="tile-value">–</div></div>
      </section>
      <p class="muted">Key numbers and today's appointments will appear here soon.</p>
    </main>
  </div>
  <script type="module" src="/js/owner-dashboard.js"></script>
</body>
</html>
