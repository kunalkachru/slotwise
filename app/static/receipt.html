<!doctype html>
<html lang="en" data-i18n-title="receipt.title">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Receipt · Slotwise</title>
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/calm.css">
</head>
<body>
  <div class="no-print">
    <button class="btn btn-ghost btn-small" type="button" onclick="history.length > 1 ? history.back() : location.assign('/')" data-i18n="nav.back">Back</button>
    <button class="btn btn-small" type="button" onclick="window.print()" data-i18n="receipt.print">Print / Save as PDF</button>
  </div>
  <main class="receipt" id="receipt" aria-live="polite"><p class="notice is-loading" data-i18n="receipt.loading">Loading receipt…</p></main>
  <script type="module" src="/js/receipt.js"></script>
</body>
</html>
